
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123d30">
<title>Notre calendrier de l'Avent ❤️</title>

<style>
:root {
  --green: #123d30;
  --green-light: #315b49;
  --red: #8f2638;
  --red-dark: #741c2d;
  --gold: #d9b76e;
  --gold-light: #f7e5b2;
  --cream: #fff8e9;
  --text: #fdf8ed;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 25px 16px 40px;
  background:
    radial-gradient(circle at 15% 15%, rgba(217,183,110,.10), transparent 25%),
    radial-gradient(circle at 85% 80%, rgba(143,38,56,.15), transparent 30%),
    var(--green);
  color: var(--text);
  font-family: Georgia, "Times New Roman", serif;
  text-align: center;
  overflow-x: hidden;
}

.container {
  max-width: 680px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

h1 {
  color: var(--gold);
  font-size: clamp(30px, 7vw, 43px);
  font-weight: normal;
  margin: 12px 0;
  line-height: 1.2;
  text-shadow: 0 2px 10px rgba(0,0,0,.25);
}

.subtitle {
  font-size: 17px;
  line-height: 1.6;
  color: #f6e9cf;
  max-width: 500px;
  margin: 0 auto 22px;
}

.separator {
  color: var(--gold);
  letter-spacing: 9px;
  margin: 18px 0;
  font-size: 17px;
}

.opening {
  color: var(--gold);
  font-size: 13px;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin: 22px 0;
}

.calendar {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 12px;
  max-width: 590px;
  margin: 0 auto;
}

/* CASES DU CALENDRIER */

.day {
  position: relative;
  min-width: 0;
  min-height: 100px;
  border: 2px solid var(--gold);
  border-radius: 13px;
  background: linear-gradient(145deg, #a12e40, var(--red-dark));
  color: #fff8e9;
  font-family: Georgia, serif;
  font-size: 29px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 0 #4f1723, 0 7px 14px rgba(0,0,0,.18);
  transition: transform .2s, box-shadow .2s, background .2s;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  padding: 8px 3px;
  -webkit-tap-highlight-color: transparent;
}

.day::before {
  content: "✦";
  position: absolute;
  top: 5px;
  right: 7px;
  color: rgba(255, 230, 170, .8);
  font-size: 10px;
}

.day:hover {
  transform: translateY(-3px);
  box-shadow: 0 7px 0 #4f1723, 0 10px 18px rgba(0,0,0,.2);
}

.day:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #4f1723;
}

.day .gift {
  font-size: 21px;
  line-height: 1;
}

.day-number {
  line-height: 1;
}

/* CASES NON ENCORE DISPONIBLES */

.day.locked {
  background: linear-gradient(145deg, #315b49, #1c4235);
  color: #d9cba9;
  border-color: #9a936f;
  cursor: not-allowed;
  box-shadow: 0 4px 0 #102d23;
}

.day.locked:hover {
  transform: none;
}

/* CASES DISPONIBLES MAIS NON CONSULTEES */

.day.available {
  background: linear-gradient(145deg, #a12e40, #741c2d);
  border-color: var(--gold);
  color: #fff8e9;
}

/* CASES DEJA CONSULTEES */

.day.visited {
  background: linear-gradient(145deg, #e5ca82, #b58d45);
  border-color: #fff0c4;
  color: #49351b;
  box-shadow: 0 4px 0 #755a2d, 0 7px 14px rgba(0,0,0,.18);
}

.day.visited::before {
  color: #fff7dc;
}

.day.visited .gift {
  font-size: 21px;
}

/* FLOC­ONS ANIMÉS */

.snowflake {
  position: fixed;
  top: -30px;
  z-index: 0;
  color: #fff;
  opacity: .75;
  pointer-events: none;
  text-shadow: 0 0 6px rgba(255,255,255,.5);
  animation: snowfall linear infinite;
  will-change: transform;
}

@keyframes snowfall {
  0% {
    transform: translate3d(0, -30px, 0) rotate(0deg);
  }
  100% {
    transform: translate3d(35px, 110vh, 0) rotate(360deg);
  }
}

.footer {
  color: #e8d8b7;
  font-size: 14px;
  line-height: 1.6;
  margin-top: 32px;
}

/* FENÊTRE POPUP */

.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  inset: 0;
  padding: 18px;
  background: rgba(0,0,0,.78);
  align-items: center;
  justify-content: center;
  overflow-y: auto;
}

.modal.active {
  display: flex;
}

.modal-content {
  position: relative;
  width: 100%;
  max-width: 480px;
  max-height: 92vh;
  overflow-y: auto;
  background: var(--cream);
  color: #38291e;
  border: 3px solid var(--gold);
  border-radius: 17px;
  padding: 22px;
  box-shadow: 0 0 35px rgba(0,0,0,.45);
  animation: appear .25s ease-out;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: scale(.94);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.close {
  position: absolute;
  top: 8px;
  right: 12px;
  border: none;
  background: transparent;
  color: #713044;
  font-size: 30px;
  cursor: pointer;
  line-height: 1;
  z-index: 2;
  padding: 5px 8px;
}

.modal-content h2 {
  color: #8f2638;
  font-size: 25px;
  font-weight: normal;
  line-height: 1.25;
  margin: 8px 28px 16px;
}

.modal-content img {
  display: block;
  width: 100%;
  max-height: 48vh;
  object-fit: contain;
  border-radius: 10px;
  margin: 0 auto 18px;
  background: #eee6d8;
}

.message {
  font-size: 17px;
  line-height: 1.7;
  text-align: center;
  color: #47372a;
  white-space: pre-line;
  margin: 0 0 10px;
}

.heart {
  color: #a12e40;
  font-size: 23px;
  margin-top: 12px;
}

/* TABLETTES */

@media (max-width: 600px) {
  .calendar {
    gap: 9px;
  }

  .day {
    min-height: 85px;
    font-size: 25px;
  }

  .day .gift {
    font-size: 19px;
  }
}

/* IPHONE */

@media (max-width: 480px) {
  body {
    padding: 12px 10px 30px;
  }

    margin: 12px 0;

  }

    margin: 12px 0;
  }

    font-size: 11px;

  }

  }

  .day {

  }

  .day .gift {
    font-size: 18px;
  }

  .footer {
    margin-top: 25px;
    font-size: 13px;
  }

  .modal {
    padding: 10px;
  }

    padding: 17px 14px;

  }

  .modal-content h2 {

    max-height: 45vh;

/* REDUCTION DES ANIMATIONS SI DEMANDEE PAR LE TELEPHONE */

@media (prefers-reduced-motion: reduce) {
  .snowflake {
    animation: none;
    display: none;
  }

  .day {
    transition: none;
  }
}
</style>
</head>

/* ------------------------------------------------
   MEMORISATION DES CASES CONSULTEES
------------------------------------------------ */

const STORAGE_KEY = "notre-avent-cases-consultees";

function getVisitedDays() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? JSON.parse(saved) : [];
  } catch (error) {
    return [];
  }
}

function saveVisitedDay(day) {
  const visited = getVisitedDays();

  if (!visited.includes(day)) {
    visited.push(day);
  }

  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(visited));
  } catch (error) {
    console.warn("La mémorisation locale n'est pas disponible.");
  }
}

/* ------------------------------------------------
   VERIFICATION DES DATES
------------------------------------------------ */

function getParisDate() {
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Europe/Paris",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());

  const result = {};

  parts.forEach(part => {
    result[part.type] = Number(part.value);
  });

  return result;
}

function availableDay(day) {

  if (TEST_MODE) return false;

  const today = getParisDate();

  if (today.year > 2026) return true;
  if (today.year < 2026) return false;

  if (today.month < 12) return false;
  if (today.month > 12) return true;

  return today.day >= day;
}


/* ------------------------------------------------
   CREATION ET AFFICHAGE DES CASES
------------------------------------------------ */

const calendar = document.getElementById("calendar");

function renderCalendar() {

  calendar.innerHTML = "";

  const visited = getVisitedDays();

  displayOrder.forEach(dayNumber => {

    const surprise = surprises[dayNumber - 1];
    const isAvailable = availableDay(dayNumber);
    const isVisited = visited.includes(dayNumber);

    const button = document.createElement("button");

    button.type = "button";
    button.className = "day";

    if (!isAvailable) {

      button.classList.add("locked");

    } else if (isVisited) {

      button.classList.add("visited");

    } else {

      button.classList.add("available");

    }

    const symbol = !isAvailable
      ? "🔒"
      : isVisited
        ? "❤️"
        : "🎁";

    button.innerHTML = `
      <span class="day-number">${dayNumber}</span>
      <span class="gift">${symbol}</span>
    `;

    button.setAttribute(
      "aria-label",
      isAvailable
        ? "Ouvrir la surprise du " + dayNumber
        : "Surprise du " + dayNumber + " verrouillée"
    );

    if (isAvailable) {
      button.addEventListener("click", () => openSurprise(dayNumber));
    }

    calendar.appendChild(button);

  });

}


/* ------------------------------------------------
   OUVERTURE DE LA POPUP
------------------------------------------------ */

const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modalTitle");
const modalImage = document.getElementById("modalImage");
const modalMessage = document.getElementById("modalMessage");
const closeButton = document.getElementById("closeModal");

function openSurprise(dayNumber) {

  if (!availableDay(dayNumber)) return;

  const surprise = surprises[dayNumber - 1];

  modalTitle.textContent = surprise.title;
  modalImage.src = surprise.image;
  modalImage.alt = surprise.title;
  modalMessage.textContent = surprise.message;

  /* On mémorise immédiatement la case consultée */

  saveVisitedDay(dayNumber);

  /* On actualise les couleurs des cases */

  renderCalendar();

  modal.classList.add("active");
  document.body.style.overflow = "hidden";

  closeButton.focus();
}


/* ------------------------------------------------
   FERMETURE DE LA POPUP
------------------------------------------------ */

function closeSurprise() {

  modal.classList.remove("active");
  document.body.style.overflow = "";

}

closeButton.addEventListener("click", closeSurprise);

modal.addEventListener("click", (event) => {

  if (event.target === modal) {
    closeSurprise();
  }

});

document.addEventListener("keydown", (event) => {

  if (event.key === "Escape" && modal.classList.contains("active")) {
    closeSurprise();
  }

});

------------------------------------------------ */

  snow.style.left = Math.random() * 100 + "vw";
  snow.style.fontSize = (10 + Math.random() * 13) + "px";
  snow.style.animationDuration = (8 + Math.random() * 12) + "s";
  snow.style.animationDelay = (-Math.random() * 20) + "s";

  document.body.appendChild(snow);

}


/* ------------------------------------------------
   INITIALISATION
------------------------------------------------ */

renderCalendar();

</script>
