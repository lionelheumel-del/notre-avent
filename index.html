<html lang="fr">
<head>
<meta charset="UTF-8">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #f7f0e9;
  font-family: Georgia, serif;
  color: #57333d;
}

.page {
  max-width: 850px;
  margin: auto;
  padding: 35px 18px 50px;
  text-align: center;
}

h1 {
  font-size: clamp(30px, 6vw, 48px);
  font-weight: normal;
  margin: 15px 0 10px;
  color: #793e4d;
}

.intro {
  color: #98766f;
  font-style: italic;
  line-height: 1.8;
  margin-bottom: 30px;
}

.cover {
  width: 100%;
  max-width: 480px;
  height: 230px;
  object-fit: cover;
  border-radius: 18px;
  box-shadow: 0 8px 25px #57333d20;
}

.counter {
  font-size: 13px;
  letter-spacing: 2px;
  color: #a17b72;
  margin: 25px 0;
}

.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  max-width: 680px;
  margin: auto;
}

.door {
  position: relative;
  aspect-ratio: 1;
  border: 1px solid #dfc4b5;
  border-radius: 14px;
  background: #fffaf5;
  color: #793e4d;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-family: Georgia, serif;
  font-size: 27px;
  transition: .25s;
  box-shadow: 0 3px 9px #57333d10;
}

.door .heart {
  font-size: 17px;
  color: #bd8585;
  margin-top: 5px;
}

.door:not(:disabled):hover {
  background: #793e4d;
  color: white;
  transform: translateY(-4px);
}

.door:not(:disabled):hover .heart {
  color: #f3d2c9;
}

.door:disabled {
  cursor: not-allowed;
  background: #eadfd8;
  color: #ad9c95;
  box-shadow: none;
}

.door:disabled .heart {
  color: #b7a49c;
}

.footer {
  margin-top: 35px;
  font-size: 14px;
  color: #98766f;
  font-style: italic;
}

/* POPUP */

.modal {
  display: none;
  position: fixed;
  z-index: 10000;
  inset: 0;
  background: #21151bdc;
  padding: 18px;
  justify-content: center;
  align-items: center;
}

.modal.open {
  display: flex;
}

.modal-content {
  background: #fffaf5;
  width: 100%;
  max-width: 510px;
  max-height: 92vh;
  overflow-y: auto;
  border-radius: 20px;
  padding: 20px;
  position: relative;
  animation: appear .3s ease;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

.close {
  position: absolute;
  right: 14px;
  top: 10px;
  border: none;
  background: #f2e4dd;
  color: #793e4d;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  font-size: 23px;
  cursor: pointer;
}

.modal-day {
  color: #a77c70;
  font-size: 13px;
  letter-spacing: 2px;
  margin: 18px 0 12px;
}

.modal-content img {
  width: 100%;
  max-height: 55vh;
  object-fit: contain;
  border-radius: 12px;
  background: #f1e7df;
}

.modal-content h2 {
  font-size: 27px;
  font-weight: normal;
  color: #793e4d;
  margin: 20px 0 12px;
}

.message {
  color: #76575a;
  font-size: 17px;
  line-height: 1.8;
  margin: 0 5px 15px;
}

.modal-heart {
  color: #bd8585;
  font-size: 22px;
}

@media(max-width:480px) {
  .page { padding: 25px 12px; }
  .grid { gap: 8px; }
  .door { font-size: 22px; border-radius: 10px; }
  .door .heart { font-size: 14px; }
  .cover { height: 190px; }
  .modal-content { padding: 14px; }
  .modal-content h2 { font-size: 23px; }
  .message { font-size: 16px; }
}
</style>
</head>

<body>

// DATE DE DEVERROUILLAGE : HEURE DE PARIS

function parisDate() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Europe/Paris",
    year: "numeric",
    month: "numeric",
    day: "numeric"
  }).formatToParts(new Date());

  const get = type => Number(parts.find(p => p.type === type).value);

  return {
    year: get("year"),
    month: get("month"),
    day: get("day")
  };
}

function availableDay() {
  const d = parisDate();

  if (d.year < 2026 || (d.year === 2026 && d.month < 12)) return 0;
  if (d.year === 2026 && d.month === 12) return Math.min(d.day, 25);
  return 25;
}

// CREATION DES 25 CASES

function renderCalendar() {
  const grid = document.getElementById("calendar");
  const unlocked = availableDay();

  grid.innerHTML = "";

  surprises.forEach((item, index) => {
    const day = index + 1;
    const open = day <= unlocked;

    const button = document.createElement("button");
    button.className = "door";
    button.type = "button";
    button.disabled = !open;
    button.innerHTML = `
      ${String(day).padStart(2, "0")}
      <span class="heart">${open ? "♥" : "🔒"}</span>
    `;

    if (open) {
      button.addEventListener("click", () => openModal(index));
    }

    grid.appendChild(button);
  });

  const counter = document.getElementById("counter");
  counter.textContent = unlocked === 0
    ? "LE CALENDRIER OUVRIRA LE 1ER DÉCEMBRE ♥"
    : unlocked === 25
      ? "25 SURPRISES DÉCOUVERTES · JOYEUX NOËL ♥"
      : `${unlocked} SUR ${surprises.length} SURPRISES DISPONIBLES ♥`;
}

// OUVERTURE DE LA POPUP

function openModal(index) {
  const item = surprises[index];

  document.getElementById("modalDay").textContent =
    `DÉCEMBRE 2026 · JOUR ${index + 1}`;

  document.getElementById("modalImage").src =
    base + item.photo;

  document.getElementById("modalTitle").textContent =
    item.title;

  document.getElementById("modalMessage").textContent =
    item.message;

  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
}

// FERMETURE EN CLIQUANT A L'EXTERIEUR

  if (e.target === this) closeModal();
});

// FERMETURE AVEC ECHAP

document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") closeModal();
});

// INITIALISATION

// Actualisation quotidienne et au changement de date
